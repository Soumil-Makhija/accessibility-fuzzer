<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Accessible keyboard fixture</title></head>
<body>
  <h1>Contact preferences</h1>
  <label for="name">Name</label><input id="name" autocomplete="name">
  <label><input id="updates" type="checkbox">Receive updates</label>
  <label for="region">Region</label><select id="region"><option>Canada</option><option>Elsewhere</option></select>
  <button id="save" type="button">Save preferences</button>
  <a id="help" href="#details">Help</a>
  <p id="details">Nothing is submitted by this fixture.</p>
  <button id="disabled" disabled>Unavailable action</button>
  <button id="hidden" hidden>Hidden action</button>
</body>
</html>
